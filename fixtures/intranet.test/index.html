<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Staff intranet: sign in</title></head>
<body>
<h1>Staff intranet</h1>
<p>Sign in with your work account. You'll be sent to the company's Microsoft sign-in page.</p>
<form action="https://login.microsoftonline.com/common/oauth2/v2.0/authorize" method="post">
  <input name="login_hint" type="email" placeholder="Work email">
  <input name="passwd" type="password" placeholder="Password">
  <button>Sign in</button>
</form>
</body>
</html>
